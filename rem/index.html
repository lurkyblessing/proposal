<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>r.e.m. beauty | Concept Proposal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-overlay"></div>
    <div class="scanline"></div>

    <nav>
        <a href="../index.html" class="back-btn">&lt;SYS.BACK&gt;</a>
        <div class="logo">r.e.m. beauty</div>
    </nav>

    <main class="cyber-container">
        <section class="hero-section">
            <div class="glitch-wrapper">
                <h1 class="glitch" data-text="CYBERCORE">CYBERCORE</h1>
                <h1 class="glitch" data-text="NOSTALGIA">NOSTALGIA</h1>
            </div>
            <p class="subtitle">Y2k is still that girl. The coolest 2026 ever starts here.</p>
        </section>

        <section class="mirror-section">
            <div class="window">
                <div class="window-header">
                    <span>lip_combo.exe</span>
                    <div class="window-controls">
                        <i>_</i><i>&square;</i><i>&times;</i>
                    </div>
                </div>
                <div class="window-content">
                    <div class="camera-feed">
                        <!-- Camera feed placeholder -->
                        <div class="face-placeholder">
                            <div class="focus-box"></div>
                            <span class="rec">REC</span>
                        </div>
                    </div>
                    <div class="side-panel">
                        <h3>Select Combo</h3>
                        <div class="product-btn" data-color="#ff99cc">
                            <span class="indicator"></span>
                            Tongue Tied Classic Lipstick
                        </div>
                        <div class="product-btn" data-color="#cc99ff">
                            <span class="indicator"></span>
                            Cotton Candy Glossy Balm
                        </div>
                        
                        <div class="info-box">
                            <p>Apply your combo. We're making the camera our mirror!</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
